
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROS: Rules of Franz</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; overflow: hidden; background: #111a16;
  color: white; font-family: Arial, sans-serif;
  user-select: none; touch-action: none;
}
button { cursor: pointer; font-weight: bold; }

/* LOADING */
#loading {
  position: fixed; inset: 0; z-index: 10;
  background: radial-gradient(#405448, #101713 75%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.logo {
  font-size: clamp(65px, 15vw, 110px);
  font-weight: 900; letter-spacing: 12px;
  color: #e4e8d1; text-shadow: 0 5px 20px black;
}
.subtitle { letter-spacing: 5px; color: #c9d7b8; }
.loadbar { width: 260px; height: 5px; background: #555; margin-top: 40px; }
#progress { width: 0%; height: 100%; background: #d6e5ac; }
#loadtext { margin-top: 12px; color: #ccc; font-size: 12px; }

/* MAIN MENU */
#menu {
  display: none; position: fixed; inset: 0;
  background:
    linear-gradient(90deg, #050b08ed, #08100b55 80%),
    linear-gradient(0deg, #030604e8, transparent 70%),
    url("https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1600") center/cover;
}
.menu-content { position: absolute; left: 8%; top: 23%; }
.menu-content h1 {
  font-size: clamp(70px, 12vw, 130px);
  line-height: .85; margin: 0; letter-spacing: 7px;
  text-shadow: 0 5px 20px black;
}
.menu-content h2 {
  letter-spacing: 6px; color: #d7e2bd;
  font-size: clamp(14px, 3vw, 22px);
  margin: 18px 0 35px;
}
.play {
  padding: 16px 65px; font-size: 22px;
  letter-spacing: 4px; color: #172019;
  background: #c5d6a1; border: 2px solid white;
}
.menu-note { margin-top: 20px; font-size: 11px; letter-spacing: 3px; color: #ccc; }

/* GAME */
#game { display: none; position: fixed; inset: 0; background: #4c6840; }
canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.top {
  position: absolute; top: 10px; left: 10px; right: 10px;
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 12px; font-weight: bold;
}
.panel {
  background: #101914c9; border: 1px solid #bdcba0;
  padding: 10px; text-shadow: 1px 1px black;
}
.health {
  position: absolute; bottom: 15px; left: 15px;
  width: 175px; padding: 9px;
  background: #101914d9; border: 1px solid #a9bb89;
  font-size: 11px;
}
.healthbar { height: 12px; background: #444; margin-top: 7px; }
#hp { width: 100%; height: 100%; background: #8fca65; }
.controls {
  position: absolute; bottom: 15px; right: 15px;
  text-align: right; font-size: 11px;
  text-shadow: 1px 1px black; line-height: 1.6;
}
.small-btn {
  pointer-events: auto; background: #243329dd;
  border: 1px solid #d5dfb5; color: white;
  padding: 9px 12px; font-size: 12px;
}
#back { position: absolute; top: 55px; left: 10px; }

/* MOBILE CONTROLS */
.mobile-controls {
  display: none; position: absolute; inset: 0;
  pointer-events: none; touch-action: none;
}
.joy-area {
  position: absolute; left: 5%; bottom: 7%;
  width: 140px; height: 140px;
  pointer-events: auto; touch-action: none;
}
.joy-base {
  width: 100%; height: 100%; border-radius: 50%;
  background: #17251e99; border: 3px solid #d4dfb599;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 15px #0008;
}
.joy-stick {
  width: 58px; height: 58px; border-radius: 50%;
  background: #d1d9b9e8; border: 2px solid white;
  box-shadow: 0 3px 10px #0009;
}
.fire-button {
  position: absolute; right: 7%; bottom: 12%;
  width: 88px; height: 88px; border-radius: 50%;
  border: 3px solid #ffd4ae; background: #b83b28e8;
  color: white; font-size: 18px; letter-spacing: 1px;
  pointer-events: auto; touch-action: none;
  box-shadow: 0 4px 15px #0009;
}
.fire-button:active { background: #f05a35; transform: scale(.93); }
.landscape-button {
  position: absolute; top: 55px; right: 10px;
}
@media (pointer: coarse), (max-width: 900px) {
  .mobile-controls { display: block; }
  .controls { display: none; }
  .health { width: 130px; bottom: 8px; left: 8px; font-size: 10px; }
  .top { font-size: 10px; }
}
#portrait {
  display: none; position: absolute; inset: 0; z-index: 4;
  background: #080e0bee; align-items: center; justify-content: center;
  text-align: center; padding: 30px; font-weight: bold;
  letter-spacing: 1px; pointer-events: none;
}
@media (orientation: portrait) and (pointer: coarse) {
  #portrait { display: flex; }
}
#end {
  display: none; position: absolute; inset: 0; z-index: 5;
  background: #000c; align-items: center; justify-content: center;
  flex-direction: column; text-align: center;
}
#end h1 { font-size: 45px; }
#end button {
  background: #bdce9a; border: 1px solid white;
  padding: 13px 25px; margin: 5px; letter-spacing: 2px;
}
</style>
</head>
<body>

<div id="loading">
  <div class="logo">ROS</div>
  <div class="subtitle">RULES OF FRANZ</div>
  <div class="loadbar"><div id="progress"></div></div>
  <div id="loadtext">LOADING... 0%</div>
</div>

<div id="menu">
  <div class="menu-content">
    <h1>ROS</h1>
    <h2>RULES OF FRANZ</h2>
    <button class="play" onclick="startGame()">PLAY</button>
    <div class="menu-note">SURVIVE • EXPLORE • WIN</div>
  </div>
</div>

<div id="game">
  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="top">
      <div class="panel">ROS: RULES OF FRANZ</div>
      <div class="panel">ELIMINATIONS: <span id="kills">0</span></div>
    </div>
    <button id="back" class="small-btn" onclick="backToMenu()">MENU</button>
    <div class="health">
      <b>HEALTH</b>
      <div class="healthbar"><div id="hp"></div></div>
      <span id="hptext">100 / 100</span>
    </div>
    <div class="controls">
      WASD / ARROWS - MOVE<br>
      MOUSE CLICK / SPACE - FIRE
    </div>
  </div>

  <div class="mobile-controls">
    <div class="joy-area" id="joyArea">
      <div class="joy-base">
        <div class="joy-stick" id="joyStick"></div>
      </div>
    </div>
    <button class="fire-button" id="fireBtn">FIRE</button>
    <button class="small-btn landscape-button" onclick="goLandscape()">⛶ LANDSCAPE</button>
  </div>

  <div id="portrait">
    <div>⟳<br><br>PLEASE ROTATE YOUR PHONE<br><br>
    I-LANDSCAPE ANG CELLPHONE PARA SA MAS MADALING PAGLALARO</div>
  </div>

  <div id="end">
    <h1 id="endtitle">GAME OVER</h1>
    <p id="endmsg">Targets defeated: 0</p>
    <button onclick="startGame()">PLAY AGAIN</button>
    <button onclick="backToMenu()">MAIN MENU</button>
  </div>
</div>

<script>
// LOADING SCREEN
const loading = document.getElementById("loading");
const progress = document.getElementById("progress");
const loadtext = document.getElementById("loadtext");
const menu = document.getElementById("menu");
const game = document.getElementById("game");

let load = 0;
const loader = setInterval(() => {
  load += Math.floor(Math.random() * 9) + 3;
  if (load >= 100) {
    load = 100;
    clearInterval(loader);
    setTimeout(() => {
      loading.style.display = "none";
      menu.style.display = "block";
    }, 400);
  }
  progress.style.width = load + "%";
  loadtext.textContent = "LOADING... " + load + "%";
}, 140);

// GAME SETUP
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const joyArea = document.getElementById("joyArea");
const joyStick = document.getElementById("joyStick");
const fireBtn = document.getElementById("fireBtn");

let W, H, running = false, animation;
let player, enemies = [], bullets = [];
let kills = 0, lastSpawn = 0;
let keys = {};
let joyX = 0, joyY = 0, joyPointer = null;
let fireTimer = null, fireHeld = false;
let mouse = {x: 0, y: 0};
const world = {w: 1800, h: 1800};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// LANDSCAPE
async function goLandscape() {
  try {
    if (document.documentElement.requestFullscreen &&
        !document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch (e) {
    alert("I-rotate ang phone sa landscape mode.");
  }
}

// START
function startGame() {
  menu.style.display = "none";
  game.style.display = "block";
  document.getElementById("end").style.display = "none";
  resize();

  player = {x: 900, y: 900, r: 15, hp: 100, speed: 3.3};
  enemies = [];
  bullets = [];
  kills = 0;
  lastSpawn = 0;
  joyX = 0;
  joyY = 0;
  keys = {};
  stopFire();
  running = true;

  updateHUD();
  spawnEnemies(6);
  cancelAnimationFrame(animation);
  loop();
}

function backToMenu() {
  running = false;
  stopFire();
  cancelAnimationFrame(animation);
  game.style.display = "none";
  document.getElementById("end").style.display = "none";
  menu.style.display = "block";
}

// SPAWN ENEMIES
function spawnEnemies(n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const distance = 250 + Math.random() * 400;
    enemies.push({
      x: Math.max(35, Math.min(world.w-35,
        player.x + Math.cos(angle)*distance)),
      y: Math.max(35, Math.min(world.h-35,
        player.y + Math.sin(angle)*distance)),
      r: 14, hp: 2, speed: .65 + Math.random()*.45
    });
  }
}

// HUD
function updateHUD() {
  document.getElementById("kills").textContent = kills;
  document.getElementById("hp").style.width =
    Math.max(0, player.hp) + "%";
  document.getElementById("hptext").textContent =
    Math.ceil(Math.max(0, player.hp)) + " / 100";
}

// SHOOT
function shoot() {
  if (!running) return;

  let target = null;
  let closest = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x-player.x, e.y-player.y);
    if (d < closest) {
      closest = d;
      target = e;
    }
  }

  let angle;
  if (window.matchMedia("(pointer: coarse)").matches && target) {
    angle = Math.atan2(target.y-player.y, target.x-player.x);
  } else {
    angle = Math.atan2(mouse.y-H/2, mouse.x-W/2);
  }

  bullets.push({
    x: player.x, y: player.y,
    vx: Math.cos(angle)*10,
    vy: Math.sin(angle)*10,
    life: 65
  });
}

// KEYBOARD CONTROLS
window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (!e.repeat) shoot();
  }
});
window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
canvas.addEventListener("click", shoot);

// JOYSTICK
function moveJoystick(e) {
  const rect = joyArea.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let x = e.clientX-cx;
  let y = e.clientY-cy;
  const max = rect.width*.34;
  const d = Math.hypot(x,y);

  if (d > max) {
    x = x/d*max;
    y = y/d*max;
  }
  joyX = x/max;
  joyY = y/max;
  joyStick.style.transform = `translate(${x}px, ${y}px)`;
}

joyArea.addEventListener("pointerdown", e => {
  e.preventDefault();
  joyPointer = e.pointerId;
  joyArea.setPointerCapture(e.pointerId);
  moveJoystick(e);
});
joyArea.addEventListener("pointermove", e => {
  if (e.pointerId === joyPointer) {
    e.preventDefault();
    moveJoystick(e);
  }
});
function resetJoystick(e) {
  if (e.pointerId !== joyPointer) return;
  joyPointer = null;
  joyX = 0;
  joyY = 0;
  joyStick.style.transform = "translate(0,0)";
}
joyArea.addEventListener("pointerup", resetJoystick);
joyArea.addEventListener("pointercancel", resetJoystick);

// FIRE BUTTON
fireBtn.addEventListener("pointerdown", e => {
  e.preventDefault();
  fireBtn.setPointerCapture(e.pointerId);
  if (fireHeld) return;
  fireHeld = true;
  shoot();
  clearInterval(fireTimer);
  fireTimer = setInterval(() => {
    if (fireHeld && running) shoot();
  }, 250);
});
function stopFire() {
  fireHeld = false;
  clearInterval(fireTimer);
}
fireBtn.addEventListener("pointerup", stopFire);
fireBtn.addEventListener("pointercancel", stopFire);
fireBtn.addEventListener("lostpointercapture", stopFire);

// MAP
function drawWorld(camX, camY) {
  ctx.fillStyle = "#506d43";
  ctx.fillRect(0, 0, W, H);

  for (let x = 0; x < world.w; x += 90) {
    for (let y = 0; y < world.h; y += 90) {
      const sx = x-camX, sy = y-camY;
      if (sx < -90 || sy < -90 || sx > W+90 || sy > H+90) continue;
      ctx.fillStyle = ((x+y)%180===0) ? "#597849" : "#4c6840";
      ctx.fillRect(sx, sy, 85, 85);
      ctx.fillStyle = "#728858";
      ctx.fillRect(sx+20, sy+15, 3, 3);
      ctx.fillRect(sx+60, sy+55, 2, 2);
    }
  }

  // TREES
  for (let x=100; x<world.w; x+=170) {
    for (let y=100; y<world.h; y+=190) {
      const sx=x-camX, sy=y-camY;
      if (sx<-70 || sy<-70 || sx>W+70 || sy>H+70) continue;
      ctx.fillStyle="#324c30";
      ctx.beginPath();
      ctx.arc(sx,sy,22,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#41643a";
      ctx.beginPath();
      ctx.arc(sx-5,sy-7,17,0,Math.PI*2);
      ctx.fill();
    }
  }

  ctx.strokeStyle="#d3d7a1";
  ctx.lineWidth=5;
  ctx.strokeRect(-camX,-camY,world.w,world.h);
}

// CHARACTERS
function drawCharacter(x,y,color,camX,camY,r) {
  const sx=x-camX, sy=y-camY;
  ctx.fillStyle="#0005";
  ctx.beginPath();
  ctx.ellipse(sx,sy+8,r+4,r/2,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(sx,sy,r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#d5c49c";
  ctx.beginPath();
  ctx.arc(sx,sy-3,r*.5,0,Math.PI*2);
  ctx.fill();
}

// MAIN GAME LOOP
function loop() {
  if (!running) return;

  let dx=joyX, dy=joyY;
  if (keys["w"] || keys["arrowup"]) dy--;
  if (keys["s"] || keys["arrowdown"]) dy++;
  if (keys["a"] || keys["arrowleft"]) dx--;
  if (keys["d"] || keys["arrowright"]) dx++;

  dx=Math.max(-1,Math.min(1,dx));
  dy=Math.max(-1,Math.min(1,dy));

  if (dx && dy) {
    const length=Math.hypot(dx,dy);
    dx/=length;
    dy/=length;
  }

  player.x=Math.max(20,Math.min(world.w-20,player.x+dx*player.speed));
  player.y=Math.max(20,Math.min(world.h-20,player.y+dy*player.speed));

  const camX=Math.max(0,Math.min(world.w-W,player.x-W/2));
  const camY=Math.max(0,Math.min(world.h-H,player.y-H/2));

  drawWorld(camX,camY);

  // ENEMIES
  for (const e of enemies) {
    const vx=player.x-e.x;
    const vy=player.y-e.y;
    const d=Math.hypot(vx,vy);
    if (d>0) {
      e.x+=vx/d*e.speed;
      e.y+=vy/d*e.speed;
    }
    if (d<player.r+e.r+2) player.hp-=.12;
    drawCharacter(e.x,e.y,"#a84b39",camX,camY,e.r);
  }

  // BULLETS
  for (const b of bullets) {
    b.x+=b.vx;
    b.y+=b.vy;
    b.life--;

    ctx.fillStyle="#ffed9a";
    ctx.beginPath();
    ctx.arc(b.x-camX,b.y-camY,4,0,Math.PI*2);
    ctx.fill();

    for (const e of enemies) {
      if (e.hp>0 && Math.hypot(b.x-e.x,b.y-e.y)<e.r+5) {
        e.hp--;
        b.life=0;
        if (e.hp<=0) kills++;
        break;
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0);
  enemies=enemies.filter(e=>e.hp>0);

  // PLAYER
  drawCharacter(player.x,player.y,"#d6d9bd",camX,camY,player.r);

  // DESKTOP AIM MARKER
  if (!window.matchMedia("(pointer: coarse)").matches) {
    ctx.strokeStyle="#f6f2c9";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(mouse.x,mouse.y,10,0,Math.PI*2);
    ctx.stroke();
  }

  // MINIMAP
  const mw=115, mh=115, mx=W-mw-15, my=90;
  ctx.fillStyle="#101914dc";
  ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle="#d5d7b2";
  ctx.lineWidth=2;
  ctx.strokeRect(mx,my,mw,mh);

  ctx.fillStyle="#d8e0ac";
  ctx.beginPath();
  ctx.arc(mx+player.x/world.w*mw,
          my+player.y/world.h*mh,4,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#dd6a51";
  for (const e of enemies) {
    ctx.fillRect(mx+e.x/world.w*mw-2,
                 my+e.y/world.h*mh-2,4,4);
  }

  // ENEMY SPAWNING
  lastSpawn++;
  if (lastSpawn>450 && enemies.length<10) {
    spawnEnemies(2);
    lastSpawn=0;
  }

  updateHUD();

  if (player.hp<=0) {
    player.hp=0;
    updateHUD();
    running=false;
    stopFire();
    document.getElementById("endtitle").textContent="GAME OVER";
    document.getElementById("endmsg").textContent="Eliminations: "+kills;
    document.getElementById("end").style.display="flex";
    return;
  }

  animation=requestAnimationFrame(loop);
}
</script>
</body>
</html>
